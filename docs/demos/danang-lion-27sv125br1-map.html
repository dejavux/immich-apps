<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>峴港 5 日 · 已確認 27SV125BR1-T</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid #2a3548;
    }
    header h1 { font-size: 1.05rem; margin: 0 0 0.25rem; font-weight: 600; }
    header p { margin: 0; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(260px, 320px) 1fr;
      min-height: 0;
    }
    .map-wrap {
      position: relative;
      min-height: 360px;
      height: 100%;
    }
    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }
      aside {
        max-height: 42vh;
        border-right: none;
        border-bottom: 1px solid #2a3548;
      }
      #dayList { display: none; }
      aside .legend { display: none; }
      .map-wrap {
        height: 52vh;
        min-height: 320px;
      }
    }
    aside {
      background: var(--panel);
      border-right: 1px solid #2a3548;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .day-tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.75rem; }
    .day-tabs button {
      border: 1px solid #3a4a63;
      background: transparent;
      color: var(--text);
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
    }
    .day-tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .day-tabs button.all-days { border-style: dashed; }
    .day-card {
      border: 1px solid #2a3548;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.5rem;
      background: #121a26;
    }
    .day-card h2 { margin: 0 0 0.35rem; font-size: 0.9rem; }
    .day-card .date { color: var(--accent); font-size: 0.78rem; margin-bottom: 0.5rem; }
    .day-card ol {
      margin: 0;
      padding-left: 0;
      list-style: none;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .day-card li {
      margin-bottom: 0.35rem;
      display: flex;
      gap: 0.4rem;
      align-items: flex-start;
      line-height: 1.35;
    }
    .day-card .seq {
      flex: 0 0 1.35rem;
      font-weight: 700;
      color: var(--accent);
      font-size: 0.78rem;
    }
    .day-card .kind {
      flex: 0 0 auto;
      font-size: 0.72rem;
      padding: 0.05rem 0.35rem;
      border-radius: 4px;
      margin-right: 0.15rem;
    }
    .kind-lodge { background: #3d3520; color: #e8c468; }
    .kind-transport { background: #1e3348; color: #7eb6ff; }
    .kind-spot { background: #243028; color: #8bcea0; }
    #map { width: 100%; height: 100%; min-height: 320px; background: #1e2633; }
    #mapError {
      display: none;
      padding: 1rem;
      color: #ffb4b4;
      font-size: 0.85rem;
      background: #2a1212;
      border: 1px solid #5c2020;
      margin: 0.5rem;
      border-radius: 8px;
    }
    .leaflet-popup-content { font-size: 0.85rem; line-height: 1.35; margin: 0.5rem 0.65rem; }
    .leaflet-popup-content strong { color: #1a1a1a; }
    .legend {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.5rem 0.75rem 0.75rem;
      border-top: 1px solid #2a3548;
    }
    .preview-banner {
      display: none;
      margin-top: 0.5rem;
      padding: 0.5rem 0.65rem;
      font-size: 0.8rem;
      line-height: 1.45;
      background: #3d2a12;
      border: 1px solid #8a6420;
      border-radius: 6px;
      color: #ffd89a;
    }
    .preview-banner a { color: #9fd4ff; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <h1>已確認參團 · 超值峴港 5 日（Date + Map）</h1>
    <p>
      2027/1/25–1/29 · TPE 長榮 · 團號 27SV125BR1-T · 跟團動線依領隊為準。
      <a href="https://travel.liontravel.com/detail?NormGroupID=5e6aa0bb-ef01-4b7b-88b9-945e81dd3a04&GroupID=27SV125BR1-T" style="color:#7eb6ff">官網</a>
      · 分享 <code>#d1</code>～<code>#d5</code> 或 <code>#all</code>
      · <a id="directMapLink" href="https://cdn.jsdelivr.net/gh/dejavux/immich-apps@main/docs/demos/danang-lion-27sv125br1-map.html" style="color:#7eb6ff">地圖直連（請用此連結，勿用 htmlpreview）</a>
    </p>
    <p class="preview-banner" id="previewBanner" role="status">
      你正在透過 htmlpreview 預覽，此模式常無法載入 Leaflet。
      請改用 <a id="previewBannerLink" href="#">地圖直連連結</a>（Safari／Chrome 直接開啟）。
    </p>
  </header>
  <div class="layout">
    <aside>
      <div class="day-tabs" id="dayTabs"></div>
      <div id="dayList"></div>
      <p class="legend">路線依序 1→2→3… · 🏨 Lodge／✈️ 交通／景點 · 跟團車線以領隊為準</p>
    </aside>
    <div class="map-wrap">
      <div id="mapError" role="alert"></div>
      <div id="map"></div>
    </div>
  </div>

  <script>
    const DIRECT_MAP_URL =
      "https://cdn.jsdelivr.net/gh/dejavux/immich-apps@main/docs/demos/danang-lion-27sv125br1-map.html";
    const LEAFLET_VERSION = "1.9.4";
    const LEAFLET_CDNS = [
      {
        css: `https://cdn.jsdelivr.net/npm/leaflet@${LEAFLET_VERSION}/dist/leaflet.css`,
        js: `https://cdn.jsdelivr.net/npm/leaflet@${LEAFLET_VERSION}/dist/leaflet.js`,
      },
      {
        css: `https://unpkg.com/leaflet@${LEAFLET_VERSION}/dist/leaflet.css`,
        js: `https://unpkg.com/leaflet@${LEAFLET_VERSION}/dist/leaflet.js`,
      },
      {
        css: `https://cdnjs.cloudflare.com/ajax/libs/leaflet/${LEAFLET_VERSION}/leaflet.css`,
        js: `https://cdnjs.cloudflare.com/ajax/libs/leaflet/${LEAFLET_VERSION}/leaflet.js`,
      },
    ];

    function showMapError(html) {
      const el = document.getElementById("mapError");
      el.style.display = "block";
      el.innerHTML = html;
    }

    function loadStylesheet(href) {
      return new Promise((resolve, reject) => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        link.onload = () => resolve();
        link.onerror = () => reject(new Error("css"));
        document.head.appendChild(link);
      });
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.async = false;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("js"));
        document.head.appendChild(script);
      });
    }

    async function loadLeaflet() {
      for (const cdn of LEAFLET_CDNS) {
        try {
          await loadStylesheet(cdn.css);
          await loadScript(cdn.js);
          if (typeof L !== "undefined") return;
        } catch {
          /* try next CDN */
        }
      }
      throw new Error("leaflet");
    }

    function setupPreviewBanner() {
      const hash = location.hash || "";
      const direct = DIRECT_MAP_URL + hash;
      const link = document.getElementById("directMapLink");
      if (link) link.href = direct;
      const bannerLink = document.getElementById("previewBannerLink");
      if (bannerLink) bannerLink.href = direct;
      if (/htmlpreview\.github\.io/i.test(location.hostname)) {
        const banner = document.getElementById("previewBanner");
        if (banner) banner.style.display = "block";
      }
    }

    const KIND_LABEL = { lodge: "Lodge", transport: "交通", spot: "景點" };

    function initMapApp() {
    const LODGE_DN = {
      kind: "lodge",
      name: "峴港海濱飯店",
      note: "Paris Deli Beach／Cicilia／Canvas 等或同級 · 美溪灣區",
      lat: 16.0682,
      lng: 108.2455,
    };
    const LODGE_HOIAN = {
      kind: "lodge",
      name: "會安古鎮飯店",
      note: "Emm Hotel／Ally Beach 等或同級",
      lat: 15.8758,
      lng: 108.3312,
    };

    const TRIP = {
      title: "超值峴港・無購物五日",
      depart: "2027-01-25",
      return: "2027-01-29",
      groupId: "27SV125BR1-T",
      days: [
        {
          day: 1,
          date: "2027-01-25",
          label: "D1 抵達・山茶・美溪",
          color: "#e74c3c",
          stops: [
            { kind: "transport", name: "峴港國際機場 (DAD)", note: "長榮 BR391 · 11:40 抵達", lat: 16.0439, lng: 108.1993 },
            { kind: "spot", name: "山茶半島", note: "Son Tra", lat: 16.102, lng: 108.279 },
            { kind: "spot", name: "靈應寺（山茶）", note: "Lin Ung · 觀音像", lat: 16.0995, lng: 108.2778 },
            { kind: "spot", name: "美溪沙灘", note: "My Khe Beach", lat: 16.0678, lng: 108.2453 },
            { ...LODGE_DN, note: "入住 · " + LODGE_DN.note },
          ],
        },
        {
          day: 2,
          date: "2027-01-26",
          label: "D2 迦南島・會安",
          color: "#3498db",
          stops: [
            { ...LODGE_DN, name: "峴港飯店（出發）", note: "早餐後出發" },
            { kind: "spot", name: "迦南島生態之旅", note: "竹桶船・椰子林", lat: 15.8842, lng: 108.3385 },
            { kind: "spot", name: "會安古鎮", note: "燈籠古鎮・自由活動", lat: 15.8801, lng: 108.3263 },
            { ...LODGE_HOIAN, note: "入住 · " + LODGE_HOIAN.note },
          ],
        },
        {
          day: 3,
          date: "2027-01-27",
          label: "D3 五行山・峴港市區",
          color: "#2ecc71",
          stops: [
            { ...LODGE_HOIAN, name: "會安飯店（出發）", note: "早餐後往峴港" },
            { kind: "spot", name: "五行山", note: "Marble Mountains", lat: 16.0038, lng: 108.2631 },
            { kind: "spot", name: "峴港大教堂", note: "粉紅教堂", lat: 16.068, lng: 108.2208 },
            { kind: "spot", name: "APEC 公園", note: "海濱公園", lat: 16.061, lng: 108.2295 },
            { kind: "spot", name: "龍橋", note: "峴港地標", lat: 16.0614, lng: 108.2275 },
            { ...LODGE_DN, note: "入住 · 續住峴港 2 晚 · " + LODGE_DN.note },
          ],
        },
        {
          day: 4,
          date: "2027-01-28",
          label: "D4 巴拿山・佛手橋",
          color: "#9b59b6",
          stops: [
            { ...LODGE_DN, name: "峴港飯店（出發）", note: "全日巴拿山" },
            { kind: "spot", name: "巴拿山纜車站", note: "Ba Na Hills 入口", lat: 15.9945, lng: 107.9892 },
            { kind: "spot", name: "黃金佛手橋", note: "Golden Bridge", lat: 15.995, lng: 107.9965 },
            { kind: "spot", name: "山頂園區", note: "靈應寺・法國村", lat: 15.9985, lng: 108.0025 },
            { ...LODGE_DN, name: "峴港飯店（返回）", note: "晚餐後休息" },
          ],
        },
        {
          day: 5,
          date: "2027-01-29",
          label: "D5 韓市・返程",
          color: "#f39c12",
          stops: [
            { ...LODGE_DN, name: "峴港飯店（出發）", note: "退房・行李" },
            { kind: "spot", name: "韓江市集 Han Market", note: "伴手禮", lat: 16.0718, lng: 108.2235 },
            { kind: "transport", name: "峴港國際機場 (DAD)", note: "長榮 BR392 · 13:00 起飛 · 16:50 抵 TPE", lat: 16.0439, lng: 108.1993 },
          ],
        },
      ],
    };

    function markerColor(stop, dayColor) {
      if (stop.kind === "lodge") return "#c9a227";
      if (stop.kind === "transport") return "#5b9bd5";
      return dayColor;
    }

    function kindTag(kind) {
      return KIND_LABEL[kind] || "景點";
    }

    const map = L.map("map", { scrollWheelZoom: true }).setView([16.05, 108.22], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    }).addTo(map);

    const layers = { markers: [], lines: [] };

    function clearLayers() {
      layers.markers.forEach((m) => map.removeLayer(m));
      layers.lines.forEach((l) => map.removeLayer(l));
      layers.markers = [];
      layers.lines = [];
    }

    function showDay(dayNum) {
      clearLayers();
      const days =
        dayNum === "all"
          ? TRIP.days
          : TRIP.days.filter((d) => d.day === dayNum);
      const bounds = [];

      days.forEach((d) => {
        const latlngs = [];
        d.stops.forEach((s, i) => {
          const seq = i + 1;
          const bg = markerColor(s, d.color);
          const icon = L.divIcon({
            className: "",
            html: `<div style="background:${bg};color:#fff;min-width:22px;height:22px;padding:0 4px;border-radius:11px;border:2px solid #fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.35)">${seq}</div>`,
            iconSize: [26, 22],
            iconAnchor: [13, 11],
          });
          const m = L.marker([s.lat, s.lng], { icon })
            .bindPopup(
              `<strong>${seq}. ${s.name}</strong><br/><em>${kindTag(s.kind)}</em> · ${d.label}<br/>${d.date}<br/>${s.note || ""}`
            )
            .addTo(map);
          layers.markers.push(m);
          latlngs.push([s.lat, s.lng]);
          bounds.push([s.lat, s.lng]);
        });
        if (latlngs.length > 1) {
          const line = L.polyline(latlngs, {
            color: d.color,
            weight: 4,
            opacity: 0.85,
            dashArray: dayNum === "all" ? "6 8" : null,
          }).addTo(map);
          layers.lines.push(line);
        }
      });

      if (bounds.length) {
        map.fitBounds(bounds, { padding: [40, 40], maxZoom: dayNum === 4 ? 12 : 13 });
      }
    }

    function renderSidebar(active) {
      const tabs = document.getElementById("dayTabs");
      tabs.innerHTML = "";
      const allBtn = document.createElement("button");
      allBtn.textContent = "全部";
      allBtn.className = "all-days" + (active === "all" ? " active" : "");
      allBtn.onclick = () => {
        location.hash = "all";
        applyDay("all");
      };
      tabs.appendChild(allBtn);
      TRIP.days.forEach((d) => {
        const b = document.createElement("button");
        b.textContent = `D${d.day}`;
        b.className = active === d.day ? "active" : "";
        b.onclick = () => {
          location.hash = `d${d.day}`;
          applyDay(d.day);
        };
        tabs.appendChild(b);
      });

      const list = document.getElementById("dayList");
      list.innerHTML = TRIP.days.map(
        (d) => `
        <article class="day-card">
          <h2>${d.label}</h2>
          <div class="date">${d.date}</div>
          <ol>${d.stops
            .map(
              (s, i) => `
            <li>
              <span class="seq">${i + 1}</span>
              <span class="kind kind-${s.kind}">${kindTag(s.kind)}</span>
              <span>${s.name}${s.note ? " — " + s.note : ""}</span>
            </li>`
            )
            .join("")}</ol>
        </article>`
      ).join("");
    }

    function parseHashDay() {
      const raw = (location.hash || "").replace(/^#/, "").toLowerCase();
      if (raw === "all") return "all";
      const m = /^d?([1-5])$/.exec(raw);
      return m ? Number(m[1]) : 1;
    }

    function applyDay(dayNum) {
      renderSidebar(dayNum);
      showDay(dayNum);
      setTimeout(refreshMapSize, 50);
    }

    applyDay(parseHashDay());
    window.addEventListener("hashchange", () => applyDay(parseHashDay()));

    function refreshMapSize() {
      map.invalidateSize({ animate: false });
    }
    window.addEventListener("load", () => setTimeout(refreshMapSize, 150));
    window.addEventListener("resize", refreshMapSize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", refreshMapSize);
    }
    setTimeout(refreshMapSize, 400);
    }

    setupPreviewBanner();

    (async function boot() {
      try {
        await loadLeaflet();
        initMapApp();
      } catch {
        const hash = location.hash || "";
        showMapError(
          `地圖元件載入失敗。請勿使用 htmlpreview，改開 <a href="${DIRECT_MAP_URL}${hash}" style="color:#9fd4ff">jsDelivr 直連</a>，或檢查網路／廣告阻擋。`
        );
      }
    })();
  </script>
</body>
</html>
