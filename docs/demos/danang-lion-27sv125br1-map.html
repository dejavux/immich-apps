<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>峴港 5 日 · 已確認 27SV125BR1-T</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1rem;
      background: var(--panel);
      border-bottom: 1px solid #2a3548;
    }
    header h1 { font-size: 1.05rem; margin: 0 0 0.25rem; font-weight: 600; }
    header p { margin: 0; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(260px, 320px) 1fr;
      min-height: 0;
    }
    .map-wrap {
      position: relative;
      min-height: 360px;
      height: 100%;
    }
    #routeLoading {
      display: none;
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      z-index: 500;
      font-size: 0.75rem;
      padding: 0.35rem 0.55rem;
      background: rgba(26, 35, 50, 0.92);
      border: 1px solid #3a4a63;
      border-radius: 6px;
      color: var(--muted);
    }
    @media (max-width: 720px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto;
      }
      aside {
        max-height: 42vh;
        border-right: none;
        border-bottom: 1px solid #2a3548;
      }
      #dayList { max-height: 38vh; overflow-y: auto; }
      aside .legend { display: none; }
      .map-wrap {
        height: 52vh;
        min-height: 320px;
      }
    }
    aside {
      background: var(--panel);
      border-right: 1px solid #2a3548;
      overflow-y: auto;
      padding: 0.5rem;
    }
    .day-tabs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.75rem; }
    .day-tabs button {
      border: 1px solid #3a4a63;
      background: transparent;
      color: var(--text);
      padding: 0.35rem 0.55rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
    }
    .day-tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .day-tabs button.all-days { border-style: dashed; }
    .day-card {
      border: 1px solid #2a3548;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.5rem;
      background: #121a26;
    }
    .day-card h2 { margin: 0 0 0.35rem; font-size: 0.9rem; }
    .day-card .date { color: var(--accent); font-size: 0.78rem; margin-bottom: 0.5rem; }
    .day-card ol {
      margin: 0;
      padding-left: 0;
      list-style: none;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .day-card li {
      margin-bottom: 0.35rem;
      display: flex;
      gap: 0.4rem;
      align-items: flex-start;
      line-height: 1.35;
    }
    .day-card .seq {
      flex: 0 0 1.35rem;
      font-weight: 700;
      color: var(--accent);
      font-size: 0.78rem;
    }
    .day-card .kind {
      flex: 0 0 auto;
      font-size: 0.72rem;
      padding: 0.05rem 0.35rem;
      border-radius: 4px;
      margin-right: 0.15rem;
    }
    .kind-lodge { background: #3d3520; color: #e8c468; }
    .kind-transport { background: #1e3348; color: #7eb6ff; }
    .kind-spot { background: #243028; color: #8bcea0; }
    #map { width: 100%; height: 100%; min-height: 320px; background: #1e2633; }
    #mapError {
      display: none;
      padding: 1rem;
      color: #ffb4b4;
      font-size: 0.85rem;
      background: #2a1212;
      border: 1px solid #5c2020;
      margin: 0.5rem;
      border-radius: 8px;
    }
    .leaflet-popup-content { font-size: 0.85rem; line-height: 1.35; margin: 0.5rem 0.65rem; }
    .leaflet-popup-content strong { color: #1a1a1a; }
    .legend {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.5rem 0.75rem 0.75rem;
      border-top: 1px solid #2a3548;
    }
    .preview-banner {
      display: none;
      margin-top: 0.5rem;
      padding: 0.5rem 0.65rem;
      font-size: 0.8rem;
      line-height: 1.45;
      background: #3d2a12;
      border: 1px solid #8a6420;
      border-radius: 6px;
      color: #ffd89a;
    }
    .preview-banner a { color: #9fd4ff; font-weight: 600; }
    .flight-panel, .optional-panel {
      border: 1px solid #2a3548;
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
      margin-bottom: 0.5rem;
      background: #121a26;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .flight-panel h3, .optional-panel summary {
      margin: 0 0 0.35rem;
      font-size: 0.82rem;
      color: var(--text);
      font-weight: 600;
    }
    .flight-leg { margin-bottom: 0.45rem; padding-bottom: 0.45rem; border-bottom: 1px dashed #2a3548; }
    .flight-leg:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .flight-leg strong { color: var(--accent); }
    .flight-links a { color: #7eb6ff; margin-right: 0.35rem; display: inline-block; margin-top: 0.2rem; }
    .flight-app-hint { font-size: 0.72rem; margin-top: 0.35rem; line-height: 1.35; }
    .optional-panel summary { cursor: pointer; list-style: none; }
    .optional-panel summary::-webkit-details-marker { display: none; }
    .optional-item { margin: 0.4rem 0; padding-left: 0.5rem; border-left: 2px solid #3a4a63; }
    .optional-item strong { color: #e8c468; font-size: 0.8rem; }
    .day-route-meta {
      font-size: 0.75rem;
      color: #9fd4ff;
      margin-bottom: 0.45rem;
      line-height: 1.35;
    }
    .leg-time {
      display: block;
      font-size: 0.7rem;
      color: #6a7d96;
      margin: 0.1rem 0 0.25rem 1.75rem;
    }
    .info-btn {
      flex: 0 0 auto;
      border: 1px solid #3a4a63;
      background: #1e2a3d;
      color: #9fd4ff;
      border-radius: 4px;
      font-size: 0.68rem;
      padding: 0.1rem 0.35rem;
      cursor: pointer;
      margin-left: auto;
    }
    .stop-label { flex: 1; min-width: 0; }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(8, 12, 18, 0.82);
      padding: 1rem;
      align-items: center;
      justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox-panel {
      width: min(420px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid #3a4a63;
      border-radius: 10px;
      padding: 1rem;
    }
    .lightbox-panel h3 { margin: 0 0 0.35rem; font-size: 1rem; }
    .lightbox-panel .poi-type { font-size: 0.75rem; color: var(--accent); margin-bottom: 0.5rem; }
    .lightbox-panel p { font-size: 0.85rem; line-height: 1.45; color: var(--muted); }
    .lightbox-panel h4 { font-size: 0.8rem; margin: 0.75rem 0 0.35rem; color: var(--text); }
    .lightbox-panel ul { margin: 0; padding-left: 1.1rem; font-size: 0.82rem; color: var(--muted); }
    .lightbox-close {
      float: right;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 1.25rem;
      cursor: pointer;
      line-height: 1;
    }
  </style>

  <script>
    const DIRECT_MAP_URL =
      "https://cdn.jsdelivr.net/gh/dejavux/immich-apps@main/docs/demos/danang-lion-27sv125br1-map.html";
    const LEAFLET_VERSION = "1.9.4";
    const LEAFLET_CDNS = [
      {
        css: `https://cdn.jsdelivr.net/npm/leaflet@${LEAFLET_VERSION}/dist/leaflet.css`,
        js: `https://cdn.jsdelivr.net/npm/leaflet@${LEAFLET_VERSION}/dist/leaflet.js`,
      },
      {
        css: `https://unpkg.com/leaflet@${LEAFLET_VERSION}/dist/leaflet.css`,
        js: `https://unpkg.com/leaflet@${LEAFLET_VERSION}/dist/leaflet.js`,
      },
      {
        css: `https://cdnjs.cloudflare.com/ajax/libs/leaflet/${LEAFLET_VERSION}/leaflet.css`,
        js: `https://cdnjs.cloudflare.com/ajax/libs/leaflet/${LEAFLET_VERSION}/leaflet.js`,
      },
    ];

    function showMapError(html) {
      const el = document.getElementById("mapError");
      el.style.display = "block";
      el.innerHTML = html;
    }

    function loadStylesheet(href) {
      return new Promise((resolve, reject) => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        link.onload = () => resolve();
        link.onerror = () => reject(new Error("css"));
        document.head.appendChild(link);
      });
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.async = false;
        script.onload = () => resolve();
        script.onerror = () => reject(new Error("js"));
        document.head.appendChild(script);
      });
    }

    async function loadLeaflet() {
      for (const cdn of LEAFLET_CDNS) {
        try {
          await loadStylesheet(cdn.css);
          await loadScript(cdn.js);
          if (typeof L !== "undefined") return;
        } catch {
          /* try next CDN */
        }
      }
      throw new Error("leaflet");
    }

    function setupPreviewBanner() {
      const hash = location.hash || "";
      const direct = DIRECT_MAP_URL + hash;
      const link = document.getElementById("directMapLink");
      if (link) link.href = direct;
      const bannerLink = document.getElementById("previewBannerLink");
      if (bannerLink) bannerLink.href = direct;
      if (/htmlpreview\.github\.io/i.test(location.hostname)) {
        const banner = document.getElementById("previewBanner");
        if (banner) banner.style.display = "block";
      }
    }

    const KIND_LABEL = { lodge: "Lodge", transport: "交通", spot: "景點" };

    function initMapApp() {
    const ENR = window.TOUR_ENRICHMENT || { flights: {}, poi: {}, optionalTours: [], optionalDisclaimer: "" };
    const dayDriveMeta = {};

    const LODGE_DN = {
      kind: "lodge",
      poiId: "lodge-dn",
      name: "峴港海濱飯店",
      note: "Paris Deli Beach／Cicilia／Canvas 等或同級 · 美溪灣區",
      lat: 16.0682,
      lng: 108.2455,
    };
    const LODGE_HOIAN = {
      kind: "lodge",
      poiId: "lodge-hoian",
      name: "會安古鎮飯店",
      note: "Emm Hotel／Ally Beach 等或同級",
      lat: 15.8758,
      lng: 108.3312,
    };

    function formatDuration(sec) {
      if (!sec || !Number.isFinite(sec)) return "—";
      const m = Math.round(sec / 60);
      if (m < 60) return `約 ${m} 分`;
      const h = Math.floor(m / 60);
      const r = m % 60;
      return r ? `約 ${h} 小時 ${r} 分` : `約 ${h} 小時`;
    }

    function formatKm(m) {
      if (!m || !Number.isFinite(m)) return "";
      return `${(m / 1000).toFixed(1)} km`;
    }

    function openPoiLightbox(poiId) {
      const p = ENR.poi?.[poiId];
      if (!p) return;
      document.getElementById("poiLightboxTitle").textContent = p.title;
      document.getElementById("poiLightboxType").textContent = p.type || "";
      document.getElementById("poiLightboxIntro").textContent = p.intro || "";
      const ev = document.getElementById("poiLightboxEvents");
      ev.innerHTML =
        p.events?.length
          ? `<h4>活動／表演</h4><ul>${p.events.map((x) => `<li>${x}</li>`).join("")}</ul>`
          : "";
      const sh = document.getElementById("poiLightboxShop");
      sh.innerHTML =
        p.shop?.length
          ? `<h4>值得買／伴手禮</h4><ul>${p.shop.map((x) => `<li>${x}</li>`).join("")}</ul>`
          : "";
      document.getElementById("poiLightbox").classList.add("open");
    }

    function closePoiLightbox() {
      document.getElementById("poiLightbox").classList.remove("open");
    }

    document.getElementById("poiLightboxClose").onclick = closePoiLightbox;
    document.getElementById("poiLightbox").onclick = (e) => {
      if (e.target.id === "poiLightbox") closePoiLightbox();
    };

    function renderFlightPanel() {
      const el = document.getElementById("flightPanel");
      const legs = [ENR.flights?.outbound, ENR.flights?.inbound].filter(Boolean);
      if (!legs.length) {
        el.innerHTML = "<h3>航班</h3><p>尚無航班資料</p>";
        return;
      }
      el.innerHTML =
        "<h3>航班</h3>" +
        legs
          .map((f) => {
            const links = (f.trackLinks || [])
              .map((l) => `<a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>`)
              .join("");
            return `<div class="flight-leg">
              <strong>${f.flightNo}</strong> · ${f.airline}<br/>
              ${f.date} ${f.depart} ${f.from} → ${f.arrive} ${f.to}<br/>
              <span class="flight-links">${links}</span>
              <div class="flight-app-hint">${f.appHint || ""}</div>
            </div>`;
          })
          .join("");
    }

    function renderOptionalPanel() {
      const el = document.getElementById("optionalPanel");
      const items = ENR.optionalTours || [];
      el.innerHTML =
        items
          .map(
            (o) =>
              `<div class="optional-item"><strong>${o.title}</strong>（${o.days}）<br/>${o.priceHint}<br/>${o.note}</div>`
          )
          .join("") + `<p style="margin:0.5rem 0 0;font-size:0.72rem">${ENR.optionalDisclaimer || ""}</p>`;
    }

    renderFlightPanel();
    renderOptionalPanel();

    const TRIP = {
      title: "超值峴港・無購物五日",
      depart: "2027-01-25",
      return: "2027-01-29",
      groupId: "27SV125BR1-T",
      days: [
        {
          day: 1,
          date: "2027-01-25",
          label: "D1 抵達・山茶・美溪",

          stops: [
            { kind: "transport", poiId: "dad", name: "峴港國際機場 (DAD)", note: "長榮 BR391 · 11:40 抵達", lat: 16.0439, lng: 108.1993 },
            { kind: "spot", poiId: "sontra", name: "山茶半島", note: "Son Tra", lat: 16.102, lng: 108.279 },
            { kind: "spot", poiId: "sontra-pagoda", name: "靈應寺（山茶）", note: "Lin Ung · 觀音像", lat: 16.0995, lng: 108.2778 },
            { kind: "spot", poiId: "mykhe", name: "美溪沙灘", note: "My Khe Beach", lat: 16.0678, lng: 108.2453 },
            { ...LODGE_DN, note: "入住 · " + LODGE_DN.note },
          ],
        },
        {
          day: 2,
          date: "2027-01-26",
          label: "D2 迦南島・會安",
          color: "#3498db",
          stops: [
            { ...LODGE_DN, name: "峴港飯店（出發）", note: "早餐後出發" },
            { kind: "spot", poiId: "camnam", name: "迦南島生態之旅", note: "竹桶船・椰子林", lat: 15.8842, lng: 108.3385 },
            { kind: "spot", poiId: "hoian", name: "會安古鎮", note: "燈籠古鎮・自由活動", lat: 15.8801, lng: 108.3263 },
            { ...LODGE_HOIAN, note: "入住 · " + LODGE_HOIAN.note },
          ],
        },
        {
          day: 3,
          date: "2027-01-27",
          label: "D3 五行山・峴港市區",
          color: "#2ecc71",
          stops: [
            { ...LODGE_HOIAN, name: "會安飯店（出發）", note: "早餐後往峴港" },
            { kind: "spot", poiId: "marble", name: "五行山", note: "Marble Mountains", lat: 16.0038, lng: 108.2631 },
            { kind: "spot", poiId: "pinkchurch", name: "峴港大教堂", note: "粉紅教堂", lat: 16.068, lng: 108.2208 },
            { kind: "spot", poiId: "apec", name: "APEC 公園", note: "海濱公園", lat: 16.061, lng: 108.2295 },
            { kind: "spot", poiId: "dragon", name: "龍橋", note: "峴港地標", lat: 16.0614, lng: 108.2275 },
            { ...LODGE_DN, note: "入住 · 續住峴港 2 晚 · " + LODGE_DN.note },

            { ...LODGE_DN, name: "峴港飯店（出發）", note: "全日巴拿山" },
            { kind: "spot", poiId: "bana-gate", name: "巴拿山纜車站", note: "Ba Na Hills 入口", lat: 15.9945, lng: 107.9892 },
            { kind: "spot", poiId: "golden-bridge", name: "黃金佛手橋", note: "Golden Bridge", lat: 15.995, lng: 107.9965 },

        },

            { ...LODGE_DN, name: "峴港飯店（出發）", note: "退房・行李" },
            { kind: "spot", poiId: "hanmarket", name: "韓江市集 Han Market", note: "伴手禮", lat: 16.0718, lng: 108.2235 },
            { kind: "transport", poiId: "dad", name: "峴港國際機場 (DAD)", note: "長榮 BR392 · 13:00 起飛 · 16:50 抵 TPE", lat: 16.0439, lng: 108.1993 },
          ],
        },
      ],
    };

    function markerColor(stop, dayColor) {
      if (stop.kind === "lodge") return "#c9a227";
      if (stop.kind === "transport") return "#5b9bd5";
      return dayColor;
    }

    function kindTag(kind) {
      return KIND_LABEL[kind] || "景點";
    }

    const map = L.map("map", { scrollWheelZoom: true }).setView([16.05, 108.22], 11);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    }).addTo(map);

    const layers = { markers: [], lines: [] };
    const routeCache = new Map();
    let routeRequestId = 0;
    const OSRM_BASE = "https://router.project-osrm.org/route/v1/driving";

    function setRouteLoading(on) {
      const el = document.getElementById("routeLoading");
      if (el) el.style.display = on ? "block" : "none";
    }

    function clearLayers() {
      layers.markers.forEach((m) => map.removeLayer(m));
      layers.lines.forEach((l) => map.removeLayer(l));
      layers.markers = [];
      layers.lines = [];
    }

    function dedupeConsecutiveStops(stops) {
      const out = [];
      for (const s of stops) {
        const prev = out[out.length - 1];
        if (prev && prev.lat === s.lat && prev.lng === s.lng) continue;
        out.push(s);
      }
      return out;
    }

    function straightLineCoords(stops) {
      return stops.map((s) => [s.lat, s.lng]);
    }

    async function osrmRoute(stops) {
      if (stops.length < 2) return null;
      const key = stops.map((s) => `${s.lng},${s.lat}`).join(";");
      if (routeCache.has(key)) return routeCache.get(key);

      const path = stops.map((s) => `${s.lng},${s.lat}`).join(";");
      const url = `${OSRM_BASE}/${path}?overview=full&geometries=geojson&continue_straight=true`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      const route = data.routes?.[0];
      if (data.code !== "Ok" || !route?.geometry?.coordinates) return null;
      const result = {
        latlngs: route.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
        duration: route.duration,
        distance: route.distance,
      };
      routeCache.set(key, result);
      return result;
    }

    async function computeDayDriveMeta(stops) {
      const legs = [];
      let totalDuration = 0;
      let totalDistance = 0;
      for (let i = 0; i < stops.length - 1; i += 1) {
        const seg = await osrmRoute([stops[i], stops[i + 1]]);
        const duration = seg?.duration ?? 0;
        const distance = seg?.distance ?? 0;
        totalDuration += duration;
        totalDistance += distance;
        legs.push({ from: i + 1, to: i + 2, duration, distance });
      }
      return { totalDuration, totalDistance, legs, stopCount: stops.length };
    }

    async function roadRouteForStops(stops) {
      const waypoints = dedupeConsecutiveStops(stops);
      if (waypoints.length < 2) return { latlngs: null, duration: 0, distance: 0 };

      const multi = await osrmRoute(waypoints);
      if (multi?.latlngs) return multi;

      const merged = [];
      let duration = 0;
      let distance = 0;
      for (let i = 0; i < waypoints.length - 1; i += 1) {
        const seg = await osrmRoute([waypoints[i], waypoints[i + 1]]);
        if (!seg?.latlngs) {
          if (!merged.length) merged.push([waypoints[i].lat, waypoints[i].lng]);
          merged.push([waypoints[i + 1].lat, waypoints[i + 1].lng]);
          continue;
        }
        duration += seg.duration || 0;
        distance += seg.distance || 0;
        const leg = [...seg.latlngs];
        if (merged.length) leg.shift();
        merged.push(...leg);
      }
      return {
        latlngs: merged.length ? merged : straightLineCoords(waypoints),
        duration,
        distance,
      };
    }

    function drawMarkersForDay(d, bounds) {
      d.stops.forEach((s, i) => {
        const seq = i + 1;
        const bg = markerColor(s, d.color);
        const icon = L.divIcon({
          className: "",
          html: `<div style="background:${bg};color:#fff;min-width:22px;height:22px;padding:0 4px;border-radius:11px;border:2px solid #fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.35)">${seq}</div>`,
          iconSize: [26, 22],
          iconAnchor: [13, 11],
        });
        const detail =
          s.poiId && ENR.poi?.[s.poiId]
            ? `<br/><a href="#" data-poi="${s.poiId}" class="poi-popup-link">詳情與購物建議</a>`
            : "";
        const m = L.marker([s.lat, s.lng], { icon })
          .bindPopup(
            `<strong>${seq}. ${s.name}</strong><br/><em>${kindTag(s.kind)}</em> · ${d.label}<br/>${d.date}<br/>${s.note || ""}${detail}`
          )
          .addTo(map);
        m.on("popupopen", () => {
          const link = document.querySelector(".poi-popup-link[data-poi]");
          if (link) {
            link.onclick = (ev) => {
              ev.preventDefault();
              openPoiLightbox(link.getAttribute("data-poi"));
            };
          }
        });
        layers.markers.push(m);
        bounds.push([s.lat, s.lng]);
      });
    }

    async function drawRoadLineForDay(d, dayNum) {
      dayDriveMeta[d.day] = await computeDayDriveMeta(d.stops);
      const route = await roadRouteForStops(d.stops);
      const coords = route?.latlngs;
      if (!coords || coords.length < 2) return;
      const meta = dayDriveMeta[d.day];
      const popup = meta
        ? `🚐 車程 ${formatDuration(meta.totalDuration)} · ${formatKm(meta.totalDistance)}<br/><small>不含景點停留</small>`
        : "";
      const line = L.polyline(coords, {
        color: d.color,
        weight: 5,
        opacity: 0.88,
        dashArray: dayNum === "all" ? "6 8" : null,
      }).addTo(map);
      if (popup) line.bindPopup(popup);
      layers.lines.push(line);
    }

    async function showDay(dayNum) {
      const reqId = ++routeRequestId;
      clearLayers();
      setRouteLoading(true);
      try {
        const days =
          dayNum === "all"
            ? TRIP.days
            : TRIP.days.filter((d) => d.day === dayNum);
        const bounds = [];

        for (const d of days) {
          drawMarkersForDay(d, bounds);
          await drawRoadLineForDay(d, dayNum);
          if (reqId !== routeRequestId) return;
        }

        if (bounds.length) {
          map.fitBounds(bounds, { padding: [40, 40], maxZoom: dayNum === 4 ? 12 : 13 });
        }
        if (reqId === routeRequestId) renderSidebar(dayNum);
      } finally {
        if (reqId === routeRequestId) setRouteLoading(false);
      }
    }

    function renderSidebar(active) {
      const tabs = document.getElementById("dayTabs");
      tabs.innerHTML = "";
      const allBtn = document.createElement("button");
      allBtn.textContent = "全部";
      allBtn.className = "all-days" + (active === "all" ? " active" : "");
      allBtn.onclick = () => {
        location.hash = "all";
        applyDay("all");
      };
      tabs.appendChild(allBtn);
      TRIP.days.forEach((d) => {
        const b = document.createElement("button");
        b.textContent = `D${d.day}`;
        b.className = active === d.day ? "active" : "";
        b.onclick = () => {
          location.hash = `d${d.day}`;
          applyDay(d.day);
        };
        tabs.appendChild(b);
      });

      const daysToShow =
        active === "all" ? TRIP.days : TRIP.days.filter((d) => d.day === active);

      const list = document.getElementById("dayList");
      list.innerHTML = daysToShow
        .map((d) => {
          const meta = dayDriveMeta[d.day];
          const metaLine = meta?.totalDuration
            ? `<div class="day-route-meta">🚐 道路車程 ${formatDuration(meta.totalDuration)} · ${formatKm(meta.totalDistance)}（不含停留）</div>`
            : "";
          const legs = meta?.legs || [];
          return `
        <article class="day-card">
          <h2>${d.label}</h2>
          <div class="date">${d.date}</div>
          ${metaLine}
          <ol>${d.stops
            .map((s, i) => {
              const leg = legs.find((l) => l.from === i + 1);
              const legLine =
                leg?.duration
                  ? `<span class="leg-time">→ 下一站 車程 ${formatDuration(leg.duration)}</span>`
                  : "";
              const btn =
                s.poiId && ENR.poi?.[s.poiId]
                  ? `<button type="button" class="info-btn" data-poi="${s.poiId}">詳情</button>`
                  : "";
              return `
            <li>
              <span class="seq">${i + 1}</span>
              <span class="kind kind-${s.kind}">${kindTag(s.kind)}</span>
              <span class="stop-label">${s.name}${s.note ? " — " + s.note : ""}</span>
              ${btn}
            </li>${legLine}`;
            })
            .join("")}</ol>
        </article>`;
        })
        .join("");

      list.querySelectorAll(".info-btn[data-poi]").forEach((btn) => {
        btn.onclick = () => openPoiLightbox(btn.getAttribute("data-poi"));
      });
    }

    function parseHashDay() {
      const raw = (location.hash || "").replace(/^#/, "").toLowerCase();
      if (raw === "all") return "all";
      const m = /^d?([1-5])$/.exec(raw);
      return m ? Number(m[1]) : 1;
    }

    function applyDay(dayNum) {
      renderSidebar(dayNum);
      showDay(dayNum).then(() => setTimeout(refreshMapSize, 50));
    }

    window.openPoiLightbox = openPoiLightbox;

    applyDay(parseHashDay());
    window.addEventListener("hashchange", () => applyDay(parseHashDay()));

    function refreshMapSize() {
      map.invalidateSize({ animate: false });
    }
    window.addEventListener("load", () => setTimeout(refreshMapSize, 150));
    window.addEventListener("resize", refreshMapSize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", refreshMapSize);
    }
    setTimeout(refreshMapSize, 400);
    }

    setupPreviewBanner();

    (async function boot() {
      try {
        await loadLeaflet();
        initMapApp();
      } catch {
        const hash = location.hash || "";
        showMapError(
          `地圖元件載入失敗。請勿使用 htmlpreview，改開 <a href="${DIRECT_MAP_URL}${hash}" style="color:#9fd4ff">jsDelivr 直連</a>，或檢查網路／廣告阻擋。`
        );
      }
    })();
  </script>
</body>
</html>
